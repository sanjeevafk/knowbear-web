services:
  knowbear:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowbear-local
    ports:
      - "5173:5173"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/venv
      - /app/api/venv
